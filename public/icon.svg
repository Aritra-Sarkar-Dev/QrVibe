  <rect x="126" y="126" width="40" height="40" rx="10" fill="url(#vibegrad)" filter="url(#glow)" />
  
  <!-- Outer Finder 2 (Top Right) -->
  <rect x="316" y="96" width="100" height="100" rx="24" fill="none" stroke="url(#vibegrad)" stroke-width="16" />
  <rect x="346" y="126" width="40" height="40" rx="10" fill="url(#vibegrad)" filter="url(#glow)" />
  
  <!-- Outer Finder 3 (Bottom Left) -->
  <rect x="96" y="316" width="100" height="100" rx="24" fill="none" stroke="url(#vibegrad)" stroke-width="16" />
  <rect x="126" y="346" width="40" height="40" rx="10" fill="url(#vibegrad)" filter="url(#glow)" />
  
  <!-- QR Pattern Stylized Dots / Cyber Wave -->
  <circle cx="256" cy="146" r="16" fill="#06b6d4" />
  <circle cx="256" cy="206" r="16" fill="#8b5cf6" />
  <circle cx="206" cy="256" r="16" fill="#d946ef" />
  <circle cx="256" cy="256" r="22" fill="url(#vibegrad)" filter="url(#glow)" />
